<style>
  /* ==========================================================================
     CSS.html - shared styling for every module page.
     Style: dark sidebar, white header, light-tinted page background, white
     cards with a colored top border per module (the FMS Tracker look).
     Plain CSS - no scriptlet tags (see Code.gs's include() comment for why).
     ========================================================================== */

  :root {
    --sidebar-bg: #1e293b;
    --sidebar-bg-hover: #334155;
    --sidebar-text: #cbd5e1;
    --sidebar-text-active: #ffffff;
    --header-bg: #ffffff;
    --page-bg: #f1f5f9;
    --card-bg: #ffffff;
    --border-color: #e2e8f0;
    --text-primary: #1e293b;
    --text-secondary: #64748b;
    --text-muted: #94a3b8;
    --accent: #2563eb;
    --accent-dashboard: #0891b2;
    --accent-jobcards: #2563eb;
    --accent-fms: #7c3aed;
    --accent-production: #0d9488;
    --accent-inventory: #d97706;
    --accent-artwork: #db2777;
    --accent-quality: #dc2626;
    --accent-delivery: #16a34a;
    --accent-purchase: #4f46e5;
    --accent-users: #475569;
    --accent-reports: #0e7490;
    --success: #16a34a;
    --warning: #d97706;
    --danger: #dc2626;
    --info: #2563eb;
    --radius: 8px;
    --shadow-sm: 0 1px 2px rgba(15, 23, 42, 0.06);
    --shadow-md: 0 4px 12px rgba(15, 23, 42, 0.08);
    --sidebar-width: 240px;
    --header-height: 60px;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    background: var(--page-bg);
    color: var(--text-primary);
    font-size: 14px;
    -webkit-font-smoothing: antialiased;
  }
  a { color: var(--accent); text-decoration: none; }
  h1, h2, h3, h4 { margin: 0 0 8px 0; font-weight: 600; }
  h1 { font-size: 22px; } h2 { font-size: 18px; } h3 { font-size: 15px; } h4 { font-size: 13px; }
  p { margin: 0 0 8px 0; color: var(--text-secondary); }

  /* ---- App shell layout: sidebar + header + main -------------------- */
  #app-shell { display: flex; min-height: 100vh; }
  .sidebar {
    width: var(--sidebar-width);
    background: var(--sidebar-bg);
    color: var(--sidebar-text);
    flex-shrink: 0;
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    overflow-y: auto;
    z-index: 20;
  }
  .sidebar__brand {
    padding: 18px 20px;
    font-size: 16px;
    font-weight: 700;
    color: #fff;
    border-bottom: 1px solid rgba(255,255,255,0.08);
    letter-spacing: 0.3px;
  }
  .sidebar__brand small { display: block; font-weight: 400; font-size: 11px; color: var(--sidebar-text); margin-top: 2px; }
  .sidebar__nav { flex: 1; padding: 10px 0; }
  .sidebar__link {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 20px;
    color: var(--sidebar-text);
    font-size: 13.5px;
    border-left: 3px solid transparent;
    cursor: pointer;
  }
  .sidebar__link:hover { background: var(--sidebar-bg-hover); color: #fff; }
  .sidebar__link.is-active {
    background: var(--sidebar-bg-hover);
    color: #fff;
    border-left-color: var(--accent-current, var(--accent));
    font-weight: 600;
  }
  .sidebar__icon { width: 8px; height: 8px; border-radius: 2px; background: currentColor; opacity: 0.6; flex-shrink: 0; }

  .main-col { margin-left: var(--sidebar-width); flex: 1; min-width: 0; display: flex; flex-direction: column; }

  .header {
    height: var(--header-height);
    background: var(--header-bg);
    border-bottom: 1px solid var(--border-color);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px;
    position: sticky; top: 0; z-index: 10;
  }
  .header__title { font-size: 17px; font-weight: 700; color: var(--text-primary); }
  .header__right { display: flex; align-items: center; gap: 16px; }
  .header__user { text-align: right; font-size: 12.5px; }
  .header__user strong { display: block; color: var(--text-primary); font-size: 13px; }
  .header__user span { color: var(--text-muted); }
  .header__logout {
    background: #fee2e2; color: var(--danger); border: none; border-radius: var(--radius);
    padding: 7px 14px; font-size: 12.5px; font-weight: 600; cursor: pointer;
  }
  .header__logout:hover { background: #fecaca; }

  .page-content { padding: 22px 24px 60px; flex: 1; }

  /* ---- Cards ---------------------------------------------------------- */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    border: 1px solid var(--border-color);
    border-top: 3px solid var(--accent-current, var(--accent));
    box-shadow: var(--shadow-sm);
    padding: 18px 20px;
    margin-bottom: 18px;
  }
  .card__header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; flex-wrap: wrap; gap: 10px; }
  .card__title { font-size: 15px; font-weight: 700; margin: 0; }

  .kpi-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 14px; margin-bottom: 18px; }
  .kpi-card {
    background: var(--card-bg); border: 1px solid var(--border-color); border-top: 3px solid var(--accent-current, var(--accent));
    border-radius: var(--radius); padding: 16px 18px; box-shadow: var(--shadow-sm);
  }
  .kpi-card__label { font-size: 12px; color: var(--text-secondary); font-weight: 600; text-transform: uppercase; letter-spacing: 0.4px; }
  .kpi-card__value { font-size: 26px; font-weight: 700; margin-top: 6px; color: var(--text-primary); }
  .kpi-card__sub { font-size: 12px; color: var(--text-muted); margin-top: 4px; }

  /* ---- Buttons ---------------------------------------------------------- */
  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 16px; border-radius: var(--radius); border: 1px solid transparent;
    font-size: 13px; font-weight: 600; cursor: pointer; background: var(--accent); color: #fff;
    transition: filter 0.1s ease;
  }
  .btn:hover { filter: brightness(0.92); }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .btn--secondary { background: #fff; color: var(--text-primary); border-color: var(--border-color); }
  .btn--danger { background: var(--danger); }
  .btn--success { background: var(--success); }
  .btn--sm { padding: 5px 10px; font-size: 12px; }
  .btn--icon { padding: 6px 8px; }

  /* ---- Forms ---------------------------------------------------------- */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 14px; }
  .form-field { display: flex; flex-direction: column; gap: 5px; }
  .form-field label { font-size: 12.5px; font-weight: 600; color: var(--text-secondary); }
  .form-field .hint { font-size: 11.5px; color: var(--text-muted); }
  input, select, textarea {
    font-family: inherit; font-size: 13.5px; padding: 9px 11px;
    border: 1px solid var(--border-color); border-radius: var(--radius);
    background: #fff; color: var(--text-primary); width: 100%;
  }
  input:focus, select:focus, textarea:focus { outline: none; border-color: var(--accent-current, var(--accent)); box-shadow: 0 0 0 3px rgba(37,99,235,0.12); }
  textarea { resize: vertical; min-height: 64px; }

  /* ---- Tables ---------------------------------------------------------- */
  .table-wrap { overflow-x: auto; }
  table.data-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  table.data-table th {
    text-align: left; padding: 10px 12px; background: #f8fafc; color: var(--text-secondary);
    font-weight: 600; font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.3px;
    border-bottom: 1px solid var(--border-color); white-space: nowrap;
  }
  table.data-table td { padding: 10px 12px; border-bottom: 1px solid var(--border-color); color: var(--text-primary); white-space: nowrap; }
  table.data-table tbody tr:hover { background: #f8fafc; }
  table.data-table .cell-actions { display: flex; gap: 6px; }
  .table-empty { padding: 30px; text-align: center; color: var(--text-muted); }

  /* ---- Status badges ---------------------------------------------------- */
  .badge {
    display: inline-block; padding: 3px 9px; border-radius: 20px; font-size: 11px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.2px;
  }
  .badge--gray { background: #f1f5f9; color: #475569; }
  .badge--blue { background: #dbeafe; color: #1d4ed8; }
  .badge--green { background: #dcfce7; color: #15803d; }
  .badge--amber { background: #fef3c7; color: #b45309; }
  .badge--red { background: #fee2e2; color: #b91c1c; }
  .badge--purple { background: #ede9fe; color: #6d28d9; }

  /* ---- Pagination -------------------------------------------------------- */
  .pagination { display: flex; align-items: center; gap: 8px; justify-content: flex-end; margin-top: 14px; font-size: 12.5px; color: var(--text-secondary); }
  .pagination__btn {
    border: 1px solid var(--border-color); background: #fff; border-radius: 6px; padding: 5px 10px; cursor: pointer; font-size: 12.5px;
  }
  .pagination__btn:disabled { opacity: 0.4; cursor: not-allowed; }

  /* ---- Toolbar / filters -------------------------------------------------- */
  .toolbar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
  .toolbar input, .toolbar select { width: auto; min-width: 160px; }

  /* ---- Modal -------------------------------------------------------- */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(15,23,42,0.45);
    align-items: center; justify-content: center; z-index: 100; padding: 20px;
  }
  .modal-overlay.is-open { display: flex; }
  .modal {
    background: #fff; border-radius: 10px; width: 100%; max-width: 560px;
    max-height: 88vh; overflow-y: auto; box-shadow: var(--shadow-md);
  }
  .modal__header { display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; border-bottom: 1px solid var(--border-color); }
  .modal__header h3 { margin: 0; }
  .modal__close { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); line-height: 1; }
  .modal__body { padding: 20px; }
  .modal__footer { padding: 14px 20px; border-top: 1px solid var(--border-color); display: flex; justify-content: flex-end; gap: 10px; }

  /* ---- Toast -------------------------------------------------------- */
  #toast-stack { position: fixed; bottom: 20px; right: 20px; z-index: 200; display: flex; flex-direction: column; gap: 8px; }
  .toast {
    background: #1e293b; color: #fff; padding: 11px 16px; border-radius: 8px; font-size: 13px;
    box-shadow: var(--shadow-md); min-width: 220px; max-width: 360px; border-left: 4px solid var(--info);
  }
  .toast--success { border-left-color: var(--success); }
  .toast--error { border-left-color: var(--danger); }
  .toast--warning { border-left-color: var(--warning); }

  /* ---- Misc / utility -------------------------------------------------------- */
  .text-muted { color: var(--text-muted); }
  .text-right { text-align: right; }
  .mt-0 { margin-top: 0; }
  .flex-row { display: flex; align-items: center; gap: 8px; }
  .spinner {
    width: 16px; height: 16px; border: 2px solid rgba(0,0,0,0.1); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.7s linear infinite; display: inline-block;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .login-shell { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: linear-gradient(135deg, #1e293b, #334155); }
  .login-card { background: #fff; border-radius: 12px; padding: 36px 34px; width: 100%; max-width: 380px; box-shadow: var(--shadow-md); }
  .login-card h1 { font-size: 20px; margin-bottom: 4px; }
  .login-card p.subtitle { margin-bottom: 22px; }
  .field-error { color: var(--danger); font-size: 12px; min-height: 16px; margin-top: 6px; }

  @media (max-width: 900px) {
    .sidebar { transform: translateX(-100%); transition: transform 0.2s ease; }
    .sidebar.is-open { transform: translateX(0); }
    .main-col { margin-left: 0; }
    .header__title { font-size: 15px; }
  }
</style>
