<script>
  /* ==========================================================================
     JS.html - shared client-side helpers used by every module page.
     ES5 only (var/function, no arrow functions/let/const/template literals -
     project convention, applied here even though the browser could run
     newer syntax, for one consistent style across every file in this repo).
     Plain <script> - no scriptlet tags (see Code.gs's include() comment).
     ========================================================================== */

var SESSION_STORAGE_KEY = 'gmerp_session';

function getSession() {
  try {
    var raw = sessionStorage.getItem(SESSION_STORAGE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}

  try {
    var rawLocal = localStorage.getItem(SESSION_STORAGE_KEY);
    if (rawLocal) return JSON.parse(rawLocal);
  } catch (e) {}

  return null;
}

function setSession(sessionId, user) {
  try {
    sessionStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
      sessionId: sessionId,
      user: user
    }));
  } catch (e) {}

  try {
    localStorage.setItem(SESSION_STORAGE_KEY, JSON.stringify({
      sessionId: sessionId,
      user: user
    }));
  } catch (e) {
    // ignore if blocked
  }
}

function clearSession() {
  try { sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
  try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
}

  function getSessionId() {
    var s = getSession();
    return s ? s.sessionId : null;
  }

  function getCurrentUser() {
    var s = getSession();
    return s ? s.user : null;
  }

  /** Called at the top of every module page except Login.html. Redirects to
   *  the login page if there's no local session; returns the user object
   *  otherwise. The server is still the real gatekeeper - see file header. */
  function requireAuth() {
    var session = getSession();
    if (!session || !session.sessionId) {
      window.location.href = '?page=login';
      return null;
    }
    return session.user;
  }

  function logout() {
    var sessionId = getSessionId();
    clearSession();
    if (sessionId) {
      callServer('AuthService.logout', sessionId).catch(function () { /* best-effort */ });
    }
    window.location.href = '?page=login';
  }

  // ---- google.script.run wrapper -------------------------------------------
  // fnPath is written everywhere in this project as 'ServiceName.methodName'
  // (e.g. 'JobCardService.createJobCard') purely for readability at the call
  // site - but google.script.run can only invoke a top-level GLOBAL function
  // declared with `function name(...)` in a .gs file. It cannot reach into a
  // namespaced object like `JobCardService.createJobCard`, so calling
  // google.script.run.JobCardService.createJobCard(...) would fail. ClientApi.gs
  // provides a flat top-level wrapper function (named just 'createJobCard')
  // for every client-facing *Service.gs method that forwards to the real
  // implementation - so only the LAST path segment is actually used here.
  // Every one of those wrapper names is verified unique across the whole
  // project (see ClientApi.gs's header), so this is safe.
  function callServer(fnPath) {
    var args = Array.prototype.slice.call(arguments, 1);
    var methodName = fnPath.split('.').pop();
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (response) {
          if (response && response.success === false) {
            reject(new Error(response.message || 'Request failed.'));
          } else {
            resolve(response);
          }
        })
        .withFailureHandler(function (error) {
          reject(new Error((error && error.message) ? error.message : 'A server error occurred.'));
        });
      runner[methodName].apply(runner, args);
    });
  }

  // ---- Toast ---------------------------------------------------------------

  function ensureToastStack_() {
    var stack = qs('toast-stack');
    if (!stack) {
      stack = document.createElement('div');
      stack.id = 'toast-stack';
      document.body.appendChild(stack);
    }
    return stack;
  }

  function showToast(message, type) {
    var stack = ensureToastStack_();
    var el = document.createElement('div');
    el.className = 'toast toast--' + (type || 'info');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(function () {
      if (el.parentNode) { el.parentNode.removeChild(el); }
    }, 3800);
  }

  function showError(err) {
    showToast((err && err.message) ? err.message : String(err), 'error');
  }

  // ---- Modal ---------------------------------------------------------------

  function openModal(modalId) {
    var el = qs(modalId);
    if (el) { el.classList.add('is-open'); }
  }

  function closeModal(modalId) {
    var el = qs(modalId);
    if (el) { el.classList.remove('is-open'); }
  }

  // ---- Formatting / escaping -------------------------------------------------

  function escapeHtml(value) {
    if (value === null || typeof value === 'undefined') { return ''; }
    return String(value)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function pad2_(n) { return (n < 10 ? '0' : '') + n; }

  /**
   * google.script.run auto-converts a server Date return value into a real
   * client-side JS Date object (not a string) - so every date/datetime field
   * coming back from a *Service.gs call can arrive as either, depending on
   * how it was produced server-side (a raw JDBC column vs. a hand-built
   * string). This normalizes both into the same {y,m,d,hh,mm} shape.
   * Reading a Date object's components uses the BROWSER's local time zone;
   * this assumes the browser is set to IST, matching APP_TIME_ZONE server-
   * side (see ARCHITECTURE.md's time-zone-consistency note) - a browser in a
   * different zone could display a date shifted by one day.
   */
  function toDateParts_(value) {
    if (Object.prototype.toString.call(value) === '[object Date]') {
      if (isNaN(value.getTime())) { return null; }
      return { y: value.getFullYear(), m: value.getMonth() + 1, d: value.getDate(), hh: value.getHours(), mm: value.getMinutes() };
    }
    var str = String(value);
    var datePart = str.indexOf('T') > -1 ? str.split('T')[0] : str.split(' ')[0];
    var dateBits = datePart.split('-');
    if (dateBits.length !== 3) { return null; }
    var timeBits = [0, 0];
    var timeStr = str.indexOf('T') > -1 ? str.split('T')[1] : (str.indexOf(' ') > -1 ? str.split(' ')[1] : null);
    if (timeStr) {
      var tb = timeStr.split(':');
      timeBits = [Number(tb[0]) || 0, Number(tb[1]) || 0];
    }
    return { y: Number(dateBits[0]), m: Number(dateBits[1]), d: Number(dateBits[2]), hh: timeBits[0], mm: timeBits[1] };
  }

  function formatDate(value) {
    if (!value) { return '-'; }
    var p = toDateParts_(value);
    if (!p) { return String(value); }
    return pad2_(p.d) + '-' + pad2_(p.m) + '-' + p.y;
  }

  function formatDateTime(value) {
    if (!value) { return '-'; }
    var p = toDateParts_(value);
    if (!p) { return String(value); }
    return pad2_(p.d) + '-' + pad2_(p.m) + '-' + p.y + ' ' + pad2_(p.hh) + ':' + pad2_(p.mm);
  }

  function formatNumber(value) {
    if (value === null || typeof value === 'undefined' || value === '') { return '-'; }
    var num = Number(value);
    if (isNaN(num)) { return String(value); }
    return num.toLocaleString('en-IN');
  }

  // ---- Misc ---------------------------------------------------------------

  function debounce(fn, waitMs) {
    var timer = null;
    return function () {
      var ctx = this;
      var args = arguments;
      clearTimeout(timer);
      timer = setTimeout(function () { fn.apply(ctx, args); }, waitMs);
    };
  }

  function setButtonLoading(btnEl, isLoading, loadingText) {
    if (!btnEl) { return; }
    if (isLoading) {
      btnEl.setAttribute('data-original-text', btnEl.innerHTML);
      btnEl.disabled = true;
      btnEl.innerHTML = '<span class="spinner"></span> ' + (loadingText || 'Please wait...');
    } else {
      btnEl.disabled = false;
      var original = btnEl.getAttribute('data-original-text');
      if (original !== null) { btnEl.innerHTML = original; }
    }
  }
</script>
