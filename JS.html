<script>
  /* Shared client-side helpers. */
  var SESSION_STORAGE_KEY = 'gmerp_session';

  function qs(id) { return document.getElementById(id); }

  function getSession() {
    var raw;
    try { raw = sessionStorage.getItem(SESSION_STORAGE_KEY); } catch (e) { raw = null; }
    if (raw) { try { return JSON.parse(raw); } catch (e2) {} }
    try { raw = localStorage.getItem(SESSION_STORAGE_KEY); } catch (e3) { raw = null; }
    if (raw) { try { return JSON.parse(raw); } catch (e4) {} }
    return null;
  }

  function setSession(sessionId, user) {
    var value = JSON.stringify({ sessionId: sessionId, user: user });
    try { sessionStorage.setItem(SESSION_STORAGE_KEY, value); } catch (e) {}
    try { localStorage.setItem(SESSION_STORAGE_KEY, value); } catch (e2) {}
  }

  function clearSession() {
    try { sessionStorage.removeItem(SESSION_STORAGE_KEY); } catch (e) {}
    try { localStorage.removeItem(SESSION_STORAGE_KEY); } catch (e2) {}
  }

  function getSessionId() {
    var session = getSession();
    return session && session.sessionId ? session.sessionId : null;
  }

  function getCurrentUser() {
    var session = getSession();
    return session ? session.user : null;
  }

  function navigateToPage(pageName) {
    var target = '?page=' + encodeURIComponent(String(pageName || 'login'));
    try {
      if (window.top && window.top !== window) {
        window.top.location.href = target;
        return;
      }
    } catch (e) {}
    window.location.href = target;
  }

  function requireAuth() {
    var session = getSession();
    if (!session || !session.sessionId || !session.user) {
      navigateToPage('login');
      return null;
    }
    return session.user;
  }

  function logout() {
    var sessionId = getSessionId();
    clearSession();
    if (sessionId && typeof google !== 'undefined' && google.script && google.script.run) {
      callServer('AuthService.logout', sessionId).catch(function () {});
    }
    navigateToPage('login');
  }

  function callServer(fnPath) {
    var args = Array.prototype.slice.call(arguments, 1);
    var methodName = String(fnPath || '').split('.').pop();
    if (!methodName || typeof google === 'undefined' || !google.script || !google.script.run) {
      return Promise.reject(new Error('The Apps Script server bridge is unavailable. Reload the page and try again.'));
    }
    return new Promise(function (resolve, reject) {
      var runner = google.script.run
        .withSuccessHandler(function (response) {
          if (response && response.success === false) {
            reject(new Error(response.message || 'Request failed.'));
          } else if (!response) {
            reject(new Error('The server returned an empty response.'));
          } else {
            resolve(response);
          }
        })
        .withFailureHandler(function (error) {
          reject(new Error((error && error.message) ? error.message : 'A server error occurred.'));
        });
      try {
        if (typeof runner[methodName] !== 'function') {
          reject(new Error('Server method is not available: ' + methodName));
          return;
        }
        runner[methodName].apply(runner, args);
      } catch (e) {
        reject(e);
      }
    });
  }

  function ensureToastStack_() {
    var stack = qs('toast-stack');
    if (!stack) {
      stack = document.createElement('div');
      stack.id = 'toast-stack';
      document.body.appendChild(stack);
    }
    return stack;
  }

  function showToast(message, type) {
    var stack = ensureToastStack_();
    var el = document.createElement('div');
    el.className = 'toast toast--' + (type || 'info');
    el.textContent = message;
    stack.appendChild(el);
    setTimeout(function () { if (el.parentNode) { el.parentNode.removeChild(el); } }, 3800);
  }

  function showError(err) {
    showToast((err && err.message) ? err.message : String(err), 'error');
  }

  function reportFatalError(message) {
    var text = (message && message.message) ? message.message : String(message || 'Unexpected application error.');
    console.error(text);
    var box = document.createElement('div');
    box.style.cssText = 'margin:24px;padding:20px;background:#fff4f4;color:#991b1b;border:1px solid #fecaca;border-radius:8px;font-family:Arial,sans-serif;';
    box.innerHTML = '<strong>Application error</strong><br><br>' + escapeHtml(text) + '<br><br><button type="button" class="btn" onclick="window.location.reload()">Reload</button>';
    document.body.insertBefore(box, document.body.firstChild);
  }

  window.addEventListener('error', function (event) { reportFatalError(event.error || event.message); });
  window.addEventListener('unhandledrejection', function (event) { reportFatalError(event.reason); });

  function openModal(modalId) { var el = qs(modalId); if (el) { el.classList.add('is-open'); } }
  function closeModal(modalId) { var el = qs(modalId); if (el) { el.classList.remove('is-open'); } }

  function escapeHtml(value) {
    if (value === null || typeof value === 'undefined') { return ''; }
    return String(value).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function pad2_(n) { return (n < 10 ? '0' : '') + n; }

  function toDateParts_(value) {
    if (Object.prototype.toString.call(value) === '[object Date]') {
      if (isNaN(value.getTime())) { return null; }
      return { y: value.getFullYear(), m: value.getMonth() + 1, d: value.getDate(), hh: value.getHours(), mm: value.getMinutes() };
    }
    var str = String(value);
    var datePart = str.indexOf('T') > -1 ? str.split('T')[0] : str.split(' ')[0];
    var dateBits = datePart.split('-');
    if (dateBits.length !== 3) { return null; }
    var timeBits = [0, 0];
    var timeStr = str.indexOf('T') > -1 ? str.split('T')[1] : (str.indexOf(' ') > -1 ? str.split(' ')[1] : null);
    if (timeStr) { var tb = timeStr.split(':'); timeBits = [Number(tb[0]) || 0, Number(tb[1]) || 0]; }
    return { y: Number(dateBits[0]), m: Number(dateBits[1]), d: Number(dateBits[2]), hh: timeBits[0], mm: timeBits[1] };
  }

  function formatDate(value) { if (!value) { return '-'; } var p = toDateParts_(value); return p ? pad2_(p.d) + '-' + pad2_(p.m) + '-' + p.y : String(value); }
  function formatDateTime(value) { if (!value) { return '-'; } var p = toDateParts_(value); return p ? pad2_(p.d) + '-' + pad2_(p.m) + '-' + p.y + ' ' + pad2_(p.hh) + ':' + pad2_(p.mm) : String(value); }
  function formatNumber(value) { if (value === null || typeof value === 'undefined' || value === '') { return '-'; } var num = Number(value); return isNaN(num) ? String(value) : num.toLocaleString('en-IN'); }

  function debounce(fn, waitMs) {
    var timer = null;
    return function () { var ctx = this; var args = arguments; clearTimeout(timer); timer = setTimeout(function () { fn.apply(ctx, args); }, waitMs); };
  }

  function setButtonLoading(btnEl, isLoading, loadingText) {
    if (!btnEl) { return; }
    if (isLoading) { btnEl.setAttribute('data-original-text', btnEl.innerHTML); btnEl.disabled = true; btnEl.innerHTML = '<span class="spinner"></span> ' + (loadingText || 'Please wait...'); }
    else { btnEl.disabled = false; var original = btnEl.getAttribute('data-original-text'); if (original !== null) { btnEl.innerHTML = original; } }
  }
</script>
